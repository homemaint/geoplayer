[package]
name = "geoplayer"
version = "0.1.0"
description = "GeoPlayer — dashcam video player with GPS, speed and time telemetry overlays"
authors = ["Pankaj"]
edition = "2021"

[lib]
name = "geoplayer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.18"
base64 = "0.22"
memchr = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
